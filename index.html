<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>화장실 지도 — 가장 가까운 공중화장실 찾기</title>
<meta name="description" content="전국 공중화장실을 실시간 내 위치 기반으로 찾아주는 지도. 도보/자전거/자동차 실제 경로와 예상 시간을 안내합니다.">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --ink:#12233D; --ink2:#2C3E58;
  --paper:#F3F6F5; --card:#FFFFFF;
  --teal:#0E8A82; --teal-d:#0A6D66; --teal-p:#E3F3F1;
  --coral:#FF5A52; --coral-d:#E14338; --coral-p:#FFE9E7;
  --amber:#D99B22; --amber-p:#FBF0DA;
  --line:#E3E8E6; --line2:#EDF1EF;
  --t2:#5B6B7A; --t3:#94A3AF;
  --shadow:0 12px 32px rgba(18,35,61,.14);
  --shadow-sm:0 3px 10px rgba(18,35,61,.08);
  --r:16px; --rs:11px; --rl:24px; --rf:999px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Pretendard',sans-serif;color:var(--ink);overflow:hidden;background:var(--paper);}
button,input,textarea{font-family:'Pretendard',sans-serif;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* ═══ 지도 ═══ */
#map{position:fixed;inset:0;z-index:1;background:#eef1f0;}
.leaflet-tile-pane{filter:saturate(.75) brightness(1.04) contrast(.96);}
.leaflet-control-attribution{font-size:9px;opacity:.6;}
.leaflet-touch .leaflet-bar{border:none;box-shadow:var(--shadow-sm);}
.leaflet-bar a{border-radius:10px!important;color:var(--ink)!important;}

/* ═══ 상단바 ═══ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:500;padding:12px 13px 0;pointer-events:none;}
.topbar>*{pointer-events:all;}
.tb1{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.logo{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  background:var(--ink);color:#fff;
  padding:9px 14px 9px 11px;border-radius:var(--rf);
  box-shadow:0 6px 18px rgba(18,35,61,.35);
}
.logo-ico{width:20px;height:20px;flex-shrink:0;}
.logo-txt{font-size:13.5px;font-weight:800;line-height:1.15;white-space:nowrap;}
.logo-sub{font-size:8.5px;font-weight:600;opacity:.65;letter-spacing:.3px;}
.sbox{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--rf);padding:0 14px;
  box-shadow:var(--shadow-sm);transition:border-color .15s;
}
.sbox:focus-within{border-color:var(--teal);}
.sbox svg{flex-shrink:0;opacity:.45;}
.sbox input{
  flex:1;border:none;background:none;font-size:14px;color:var(--ink);
  padding:11px 0;outline:none;
}
.sbox input::placeholder{color:var(--t3);}
.sbox .clr{opacity:0;pointer-events:none;font-size:15px;color:var(--t3);background:none;border:none;cursor:pointer;padding:4px;}
.sbox.has .clr{opacity:1;pointer-events:all;}

.tb2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.tb2::-webkit-scrollbar{display:none;}
.fp{
  flex-shrink:0;height:32px;padding:0 13px;border-radius:var(--rf);
  border:1.5px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--t2);
  cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;
  box-shadow:var(--shadow-sm);transition:all .12s;
}
.fp.on{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ═══ FAB ═══ */
.fabs{position:fixed;right:13px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:500;display:flex;flex-direction:column;gap:9px;}
.fab{
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:transform .12s;background:var(--card);
}
.fab:active{transform:scale(.9);}
.fab-loc svg{stroke:var(--ink);}
.fab-loc.busy svg{stroke:var(--t3);}
.fab-sos{background:var(--coral);animation:sospulse 2.2s infinite;}
@keyframes sospulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,82,.45), var(--shadow)}60%{box-shadow:0 0 0 11px rgba(255,90,82,0), var(--shadow)}}

/* ═══ 하단 리스트 패널 ═══ */
.panel{
  position:fixed;z-index:400;background:var(--card);
  display:flex;flex-direction:column;overflow:hidden;
  bottom:0;left:0;right:0;
  border-radius:var(--rl) var(--rl) 0 0;
  box-shadow:0 -6px 28px rgba(18,35,61,.14);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  transform:translateY(calc(100% - 64px));
  max-height:84vh;
}
.panel.half{transform:translateY(calc(100% - 280px));}
.panel.full{transform:translateY(0);}

.grip-area{padding:11px 16px 6px;cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;}
.grip{width:36px;height:4px;background:var(--line);border-radius:var(--rf);}
.grip-row{width:100%;display:flex;justify-content:space-between;align-items:center;}
.grip-cnt{font-size:14.5px;font-weight:800;}
.grip-cnt strong{color:var(--teal-d);}
.grip-hint{font-size:11px;color:var(--t3);font-weight:600;}

.sort-row{display:flex;gap:5px;padding:0 13px 9px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid var(--line2);}
.sort-row::-webkit-scrollbar{display:none;}
.sc{
  flex-shrink:0;height:28px;padding:0 11px;border-radius:var(--rf);
  border:1.5px solid var(--line);background:var(--paper);
  font-size:11.5px;font-weight:700;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;gap:3px;
}
.sc.on{background:var(--ink);border-color:var(--ink);color:#fff;}

.list-wrap{overflow-y:auto;flex:1;padding:9px 12px 16px;}
.list-wrap::-webkit-scrollbar{width:3px;}
.list-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--t3);font-size:13px;}

.dbadge{
  padding:9px 14px;border-top:1px solid var(--line2);
  font-size:10.5px;color:var(--t3);font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--paper);flex-shrink:0;
}

/* ═══ 화장실 카드 ═══ */
.tcard{
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r);
  padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:all .12s;
}
.tcard:active{transform:scale(.985);}
.tcard.sel{border-color:var(--teal);background:var(--teal-p);}

/* 원형 도보시간 게이지 (시그니처 요소) */
.ring{position:relative;width:50px;height:50px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--line2);stroke-width:4;}
.ring-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .3s;}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-min{font-size:14px;font-weight:900;line-height:1;}
.ring-u{font-size:8px;font-weight:700;color:var(--t3);margin-top:1px;}

.tc-body{flex:1;min-width:0;}
.tc-r1{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px;}
.tc-name{font-size:14px;font-weight:800;line-height:1.3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-dist{font-size:11px;font-weight:700;color:var(--teal-d);white-space:nowrap;flex-shrink:0;}
.tc-addr{font-size:11px;color:var(--t3);margin-bottom:6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-tags{display:flex;gap:4px;flex-wrap:wrap;}
.pill{font-size:9.5px;padding:2.5px 7px;border-radius:6px;font-weight:700;line-height:1.5;}
.p24{background:#E5EEFB;color:#2255A4;}
.pdis{background:#F1E7F7;color:#7A3AA6;}
.pbaby{background:#FDF0DC;color:#B5720C;}
.pccv{background:#E7E9F5;color:#3F4AA0;}
.pbell{background:var(--coral-p);color:var(--coral-d);}
.pchk{background:var(--amber-p);color:var(--amber);}

/* ═══ 상세 패널 ═══ */
.detail{
  position:fixed;bottom:0;left:0;right:0;z-index:600;
  background:var(--card);border-radius:var(--rl) var(--rl) 0 0;
  box-shadow:0 -10px 40px rgba(18,35,61,.22);
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  max-height:92vh;overflow-y:auto;
}
.detail.show{transform:translateY(0);}
.detail::-webkit-scrollbar{display:none;}

.d-grip{width:36px;height:4px;background:var(--line);border-radius:var(--rf);margin:12px auto 0;}
.d-head{padding:16px 18px 16px;background:linear-gradient(160deg,var(--teal-p),var(--card) 65%);position:relative;}
.d-close{
  position:absolute;top:13px;right:14px;width:29px;height:29px;border-radius:50%;
  border:none;background:rgba(18,35,61,.07);cursor:pointer;
  font-size:14px;color:var(--t2);display:flex;align-items:center;justify-content:center;
}
.d-kind{font-size:10.5px;font-weight:700;color:var(--teal-d);letter-spacing:.3px;margin-bottom:5px;}
.d-name{font-size:18px;font-weight:900;line-height:1.32;margin-bottom:5px;padding-right:34px;}
.d-addr{font-size:12.5px;color:var(--t2);margin-bottom:10px;line-height:1.4;}
.d-tags{display:flex;gap:5px;flex-wrap:wrap;}
.d-body{padding:16px 18px 30px;}
.sec{font-size:10.5px;font-weight:800;color:var(--t3);letter-spacing:.7px;text-transform:uppercase;margin:18px 0 10px;}
.sec:first-child{margin-top:0;}

.acc-note{
  display:flex;gap:9px;align-items:flex-start;background:var(--amber-p);border-radius:var(--rs);
  padding:11px 12px;margin-bottom:4px;font-size:12px;color:#8A6415;line-height:1.5;
}
.acc-note svg{flex-shrink:0;margin-top:1px;}

.dist-block{display:flex;align-items:center;gap:15px;}
.dist-ring{position:relative;width:72px;height:72px;flex-shrink:0;}
.dist-ring svg{transform:rotate(-90deg);}
.dist-ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dist-ring-min{font-size:20px;font-weight:900;line-height:1;}
.dist-ring-u{font-size:9px;font-weight:700;color:var(--t3);}
.dist-info-l{font-size:11px;color:var(--t3);margin-bottom:2px;}
.dist-info-v{font-size:15px;font-weight:800;}
.dist-info-s{font-size:11px;color:var(--t2);margin-top:3px;}

.i-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.ig{background:var(--paper);border-radius:var(--rs);padding:11px 12px;}
.ig-l{font-size:10px;color:var(--t3);margin-bottom:3px;font-weight:700;}
.ig-v{font-size:12.5px;font-weight:700;line-height:1.35;}
.ig-v a{color:var(--teal-d);text-decoration:none;}

.btn-nav{
  width:100%;padding:15px;border:none;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-nav:active{background:var(--ink2);}

/* ═══ 길찾기 패널 ═══ */
.route-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:650;
  background:var(--card);border-radius:var(--rl) var(--rl) 0 0;
  box-shadow:0 -10px 40px rgba(18,35,61,.22);
  transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);
  max-height:78vh;display:flex;flex-direction:column;
}
.route-panel.show{transform:translateY(0);}
.rp-grip{width:36px;height:4px;background:var(--line);border-radius:var(--rf);margin:12px auto 0;flex-shrink:0;}
.rp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;flex-shrink:0;}
.rp-title{font-size:14.5px;font-weight:800;}
.rp-close{width:29px;height:29px;border-radius:50%;border:none;background:var(--paper);cursor:pointer;font-size:14px;color:var(--t2);}

.mode-bar{display:flex;gap:7px;padding:0 18px 12px;flex-shrink:0;}
.mbt{
  flex:1;padding:10px 0;border-radius:var(--rs);border:1.5px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.mbt.on{background:var(--ink);border-color:var(--ink);color:#fff;}

.rt-stats{display:flex;gap:0;padding:0 18px 14px;flex-shrink:0;border-bottom:1px solid var(--line2);}
.rts{flex:1;text-align:center;padding:0 4px;}
.rts-l{font-size:10px;color:var(--t3);font-weight:700;margin-bottom:3px;}
.rts-v{font-size:20px;font-weight:900;}
.rts-u{font-size:10px;color:var(--t3);font-weight:700;}

.steps-wrap{overflow-y:auto;flex:1;padding:6px 18px 24px;}
.step{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2);}
.step:last-child{border-bottom:none;}
.step-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--paper);}
.step-txt{font-size:13px;font-weight:700;line-height:1.4;}
.step-sub{display:flex;gap:8px;font-size:11px;color:var(--t3);margin-top:2px;font-weight:600;}
.badge-road{background:var(--paper);padding:1px 6px;border-radius:4px;font-size:10px;}
.badge-cross{background:var(--amber-p);color:var(--amber);padding:1px 6px;border-radius:4px;}

/* ═══ 긴급 모드 ═══ */
.urg{
  position:fixed;inset:0;z-index:800;background:rgba(18,35,61,.55);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;padding:20px;
}
.urg.show{opacity:1;pointer-events:all;}
.urg-card{background:var(--card);border-radius:var(--rl);padding:30px 26px;text-align:center;max-width:340px;box-shadow:var(--shadow);}
.urg-ico{width:56px;height:56px;border-radius:50%;background:var(--coral-p);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.urg-title{font-size:13px;color:var(--t2);font-weight:700;margin-bottom:6px;}
.urg-name{font-size:19px;font-weight:900;margin-bottom:6px;line-height:1.3;}
.urg-dist{font-size:14px;color:var(--teal-d);font-weight:800;margin-bottom:20px;}
.urg-btns{display:flex;gap:8px;}
.urg-btn{flex:1;padding:13px;border-radius:var(--rs);border:none;font-size:13.5px;font-weight:800;cursor:pointer;}
.urg-go{background:var(--ink);color:#fff;}
.urg-close{background:var(--paper);color:var(--t2);}

/* ═══ 기타 ═══ */
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(10px);z-index:900;
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--rf);
  font-size:12.5px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.load-t{font-size:14px;font-weight:800;color:var(--ink);}
.load-s{font-size:11.5px;color:var(--t3);}

@media(min-width:760px){
  .panel{left:16px;right:auto;width:380px;bottom:16px;border-radius:var(--rl);transform:translateY(0)!important;max-height:calc(100vh - 32px);}
  .grip-area{cursor:default;}
  .grip{display:none;}
  .grip-hint{display:none;}
  .fabs{right:16px;bottom:16px;}
  .detail,.route-panel{left:16px;right:auto;width:380px;border-radius:var(--rl);bottom:16px;max-height:calc(100vh - 32px);}
}
</style>
</head>
<body>

<div id="map"></div>

<!-- 상단바 -->
<div class="topbar">
  <div class="tb1">
    <div class="logo">
      <svg class="logo-ico" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18"/><path d="M4 13h12"/><path d="M18 9h2a2 2 0 0 1 2 2v11"/><circle cx="9" cy="7" r="1" fill="white" stroke="none"/></svg>
      <div>
        <div class="logo-txt">화장실 지도</div>
        <div class="logo-sub">TOILET FINDER KR</div>
      </div>
    </div>
    <div class="sbox" id="sbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="장소·주소 검색" oninput="onSearchInput(this.value)">
      <button class="clr" onclick="clearSearch()">✕</button>
    </div>
  </div>
  <div class="tb2">
    <div class="fp on" onclick="setF('all',this)">전체</div>
    <div class="fp" onclick="setF('24h',this)">🕛 24시간</div>
    <div class="fp" onclick="setF('disabled',this)">♿ 장애인</div>
    <div class="fp" onclick="setF('baby',this)">🍼 유아</div>
    <div class="fp" onclick="setF('cctv',this)">📹 CCTV</div>
    <div class="fp" onclick="setF('bell',this)">🔔 비상벨</div>
    <div class="fp" onclick="setF('verified',this)">✓ 위치확인됨</div>
  </div>
</div>

<!-- FAB -->
<div class="fabs">
  <button class="fab fab-loc" id="locBtn" onclick="locate()">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="fab fab-sos" onclick="showUrg()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
  </button>
</div>

<!-- 하단 리스트 패널 -->
<div class="panel" id="panel">
  <div class="grip-area" onclick="togglePanel()">
    <div class="grip"></div>
    <div class="grip-row">
      <span class="grip-cnt">주변 <strong id="cnt">0</strong>개 화장실</span>
      <span class="grip-hint">탭해서 펼치기</span>
    </div>
  </div>
  <div class="sort-row">
    <div class="sc on" onclick="setSort('dist',this)">거리순</div>
    <div class="sc" onclick="setSort('name',this)">가나다순</div>
  </div>
  <div class="list-wrap" id="listWrap"></div>
  <div class="dbadge"><span>📍 행정안전부 공중화장실 정보 (공공데이터포털)</span></div>
</div>

<!-- 상세 패널 -->
<div class="detail" id="detailPanel">
  <div class="d-grip"></div>
  <div class="d-head">
    <button class="d-close" onclick="closeDetail()">✕</button>
    <div class="d-kind" id="dKind"></div>
    <div class="d-name" id="dName"></div>
    <div class="d-addr" id="dAddr"></div>
    <div class="d-tags" id="dTags"></div>
  </div>
  <div class="d-body">
    <div id="dAccNote"></div>
    <div class="sec">직선 거리</div>
    <div class="dist-block">

<!-- 길찾기 패널 -->

<!-- 긴급 -->
<div class="urg" id="urgPanel">
  <div class="urg-card">
    <div class="urg-ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF5A52" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
    </div>
    <div class="urg-title">가장 가까운 화장실</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading">
  <div class="spin"></div>
  <div class="load-t">전국 화장실 정보 불러오는 중</div>
  <div class="load-s" id="loadSub">데이터 로딩 중...</div>
</div>

<script src="toilets_data.js"></script>
<script>
// ──────────────────────────────────────────────────────
// 전역 상태
// ──────────────────────────────────────────────────────
let map;
let uLat = 37.5665, uLng = 126.9780; // 기본: 서울시청
let hasRealLocation = false;
let uCircle = null, uPulse = null;
let selStars = 0;

let curMode = 'walk';
let routeTarget = null;
let routeLines = [];
let routeController = null;

let allData = [];
let nearList = [];
let dispList = [];
let openId = null;

let curFilter = 'all';
let curSort = 'dist';
let isLocating = false;
let mrkLayer = [];

const OSRM_PROFILE = { walk:'foot', bike:'cycling', car:'driving' };
const MODE_LABEL = { walk:'도보', bike:'자전거', car:'자동차' };
const ROUTE_COLOR = { walk:'#0E8A82', bike:'#D99B22', car:'#12233D' };
const SPEED_PER_MIN = { walk: 66.7, bike: 250, car: 500 };
const SPEED_KMH     = { walk: 4,    bike: 15,  car: 30 };

// ──────────────────────────────────────────────────────
// 지도 초기화
// ──────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: true, preferCanvas: true })
    .setView([36.5, 127.8], 7);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · 데이터: 행정안전부',
    maxZoom: 19, minZoom: 5, subdomains: 'abc'
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);
  map.on('zoomend moveend', renderByZoom);
  setTimeout(loadData, 100);
}

// ──────────────────────────────────────────────────────
// 데이터 로드
// ──────────────────────────────────────────────────────
function loadData() {
  try {
    if (typeof TOILET_DATA === 'undefined') throw new Error('데이터 없음');
    allData = TOILET_DATA.map(t => ({
      id: t.i, name: t.n, address: t.a, lat: t.la, lng: t.ln,
      hours: t.h, is24h: t.t === 1, disabled: t.d === 1,
      baby: t.b === 1, cctv: t.c === 1, bell: t.e === 1,
      kind: t.k || '공중화장실', tel: t.tel || '',
      verified: t.v === 1,
    }));
    document.getElementById('loadSub').textContent = allData.length.toLocaleString() + '개 데이터';
    document.getElementById('loading').style.display = 'none';
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => { uLat = p.coords.latitude; uLng = p.coords.longitude; hasRealLocation = true; onLocated(); startWatch(); },
        () => { onLocated(); startWatch(); },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    } else onLocated();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    showToast('❌ toilets_data.js 파일을 함께 올려주세요');
  }
}

// 실시간 위치 추적 (계속 GPS 확인)
let watchId = null;
let lastWatchUpdate = 0;
function startWatch() {
  if (!navigator.geolocation || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(
    p => {
      uLat = p.coords.latitude; uLng = p.coords.longitude; hasRealLocation = true;
      moveUserMarker();
      const now = Date.now();
      if (now - lastWatchUpdate > 3000) {  // 3초에 한 번만 목록/거리 갱신 (성능)
        lastWatchUpdate = now;
        updateNearby();
        if (openId !== null) openDetail(openId, true);
      }
    },
    () => {},
    { enableHighAccuracy: true, maximumAge: 4000, timeout: 15000 }
  );
}

function onLocated() {
  map.setView([uLat, uLng], hasRealLocation ? 16 : 12);
  placeUserMarker();
  updateNearby();
  renderByZoom();
}

// ──────────────────────────────────────────────────────
// 내 위치 마커
// ──────────────────────────────────────────────────────
function placeUserMarker() {
  if (uPulse) { try { map.removeLayer(uPulse); } catch(e){} uPulse = null; }
  if (uCircle) { try { map.removeLayer(uCircle); } catch(e){} uCircle = null; }

  uPulse = L.circleMarker([uLat, uLng], {
    radius: 17, fillColor: '#2A7FE8', color: 'transparent', fillOpacity: .16, weight: 0
  }).addTo(map);

  uCircle = L.circleMarker([uLat, uLng], {
    radius: 8, fillColor: '#2A7FE8', color: 'white', weight: 3, fillOpacity: 1
  }).addTo(map).bindPopup(hasRealLocation ? '<b>📍 내 위치 (실시간)</b>' : '<b>📍 대략적 위치 (권한 필요)</b>');
}

// GPS 갱신마다 마커만 부드럽게 이동 (재생성 X, 성능 위해)
function moveUserMarker() {
  if (uPulse) uPulse.setLatLng([uLat, uLng]);
  if (uCircle) uCircle.setLatLng([uLat, uLng]);
  else placeUserMarker();
}

function locate() {
  if (isLocating) return;
  isLocating = true;
  document.getElementById('locBtn').classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    p => {
      uLat = p.coords.latitude; uLng = p.coords.longitude; hasRealLocation = true;
      map.setView([uLat, uLng], 17);
      placeUserMarker();
      updateNearby();
      renderByZoom();
      startWatch();
      showToast('✅ 내 위치를 찾았어요 · 실시간 추적 중');
      document.getElementById('locBtn').classList.remove('busy');
      isLocating = false;
    },
    () => {
      showToast('❌ 위치 권한을 허용해주세요');
      document.getElementById('locBtn').classList.remove('busy');
      isLocating = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ──────────────────────────────────────────────────────
// 주변 목록
// ──────────────────────────────────────────────────────
function updateNearby() {
  nearList = allData
    .map(t => ({ ...t, dist: Math.round(haversine(uLat, uLng, t.lat, t.lng)) }))
    .sort((a, b) => a.dist - b.dist);

  document.getElementById('cnt').textContent = nearList.filter(t => t.dist <= 5000).length.toLocaleString();

  let list = nearList.filter(t => t.dist <= 5000).slice(0, 60);
  list = filterData(list, curFilter);
  dispList = list;
  renderList(sortList(list, curSort));
}

function sortList(list, by) {
  return [...list].sort((a, b) => {
    if (by === 'dist') return a.dist - b.dist;
    if (by === 'name') return a.name.localeCompare(b.name, 'ko');
    return 0;
  });
}

// ──────────────────────────────────────────────────────
// 지도 마커 렌더링 (줌 기반)
// ──────────────────────────────────────────────────────
// 화장실 픽토그램 아이콘 (동그라미 대신 사용)
const TOILET_SVG_PATH = 'M12 2a2.6 2.6 0 1 1 0 5.2A2.6 2.6 0 0 1 12 2zM8.6 9.4h6.8c.6 0 1 .5.9 1.1l-.9 5.3h-1.6V21h-1.6v-5.2h-1.6V21H8.9v-5.2H7.3l-.9-5.3c-.1-.6.3-1.1.9-1.1z';
function toiletIcon(color, verified, size) {
  const html = `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};
    display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:0 2px 6px rgba(18,35,61,.4);border:2px solid #fff;
    ${verified ? '' : 'opacity:.88;'}">
    <svg width="${Math.round(size*0.58)}" height="${Math.round(size*0.58)}" viewBox="0 0 24 24" fill="white"><path d="${TOILET_SVG_PATH}"/></svg>
    ${verified ? '' : `<div style="position:absolute;top:-2px;right:-2px;width:${Math.max(9,size*0.32)}px;height:${Math.max(9,size*0.32)}px;background:#D99B22;border-radius:50%;border:1.5px solid #fff;"></div>`}
  </div>`;
  return L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size/2, size/2] });
}

function renderByZoom() {
  if (!allData.length) return;
  const z = map.getZoom();
  const b = map.getBounds();
  clearMapMarkers();

  let filtered = filterData(allData, curFilter);
  let inView = filtered.filter(t => b.contains([t.lat, t.lng]));

  if (z >= 15) {
    renderIconMarkers(inView.slice(0, 220), 32);
  } else if (z >= 13) {
    renderIconMarkers(inView.slice(0, 450), 24);
  } else if (z >= 10) {
    renderDotMarkers(inView.filter((_, i) => i % 3 === 0).slice(0, 600), 3.5);
  } else {
    renderDotMarkers(filtered.filter((_, i) => i % 6 === 0).slice(0, 2500), 2.5);
  }
}

function renderIconMarkers(list, size) {
  list.forEach(t => {
    const m = L.marker([t.lat, t.lng], {
      icon: toiletIcon(t.verified ? '#0E8A82' : '#D99B22', t.verified, size)
    }).addTo(map);
    m.on('click', () => openDetail(t.id));
    mrkLayer.push(m);
  });
}

function renderDotMarkers(list, radius) {
  list.forEach(t => {
    const verified = t.verified;
    const m = L.circleMarker([t.lat, t.lng], {
      radius, weight: 1.5, color: '#fff',
      fillColor: verified ? '#0E8A82' : '#D99B22',
      fillOpacity: .95, dashArray: verified ? null : '2,2'
    }).addTo(map);
    m.on('click', () => openDetail(t.id));
    mrkLayer.push(m);
  });
}

function clearMapMarkers() {
  mrkLayer.forEach(m => { try { map.removeLayer(m); } catch(e){} });
  mrkLayer = [];
}

function filterData(data, filter) {
  switch (filter) {
    case '24h': return data.filter(t => t.is24h);
    case 'disabled': return data.filter(t => t.disabled);
    case 'baby': return data.filter(t => t.baby);
    case 'cctv': return data.filter(t => t.cctv);
    case 'bell': return data.filter(t => t.bell);
    case 'verified': return data.filter(t => t.verified);
    default: return data;
  }
}

function setF(key, el) {
  curFilter = key;
  document.querySelectorAll('.fp').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  renderByZoom();
  updateNearby();
}

function setSort(by, el) {
  document.querySelectorAll('.sc').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  curSort = by;
  renderList(sortList(dispList, by));
}

// ──────────────────────────────────────────────────────
// 리스트 카드 렌더링 (도보시간 링 = 시그니처 요소)
// ──────────────────────────────────────────────────────
function walkMinutes(distM) { return Math.max(1, Math.round(distM / SPEED_PER_MIN.walk)); }

function ringColor(min) {
  if (min <= 5) return '#0E8A82';
  if (min <= 15) return '#D99B22';
  return '#FF5A52';
}

function ringSvg(min, r) {
  const C = 2 * Math.PI * r;
  const pct = Math.min(1, min / 20);
  const dash = Math.max(C * 0.06, C * pct);
  return { dash: `${dash} ${C}`, color: ringColor(min) };
}

function renderList(list) {
  if (!list.length) {
    document.getElementById('listWrap').innerHTML = '<div class="empty-state">🚻 조건에 맞는 화장실이 없어요<br>필터를 바꿔보세요</div>';
    return;
  }
  document.getElementById('listWrap').innerHTML = list.map(t => {
    const min = walkMinutes(t.dist);
    const { dash, color } = ringSvg(min, 21);
    const distTxt = t.dist >= 1000 ? (t.dist/1000).toFixed(1) + 'km' : t.dist + 'm';
    return `
      <div class="tcard ${openId === t.id ? 'sel' : ''}" onclick="openDetail(${t.id})">
        <div class="ring">
          <svg viewBox="0 0 50 50" width="50" height="50">
            <circle class="ring-bg" cx="25" cy="25" r="21"/>
            <circle class="ring-fg" cx="25" cy="25" r="21" stroke="${color}" stroke-dasharray="${dash}"/>
          </svg>
          <div class="ring-txt">
            <div class="ring-min num">${min}</div>
            <div class="ring-u">분</div>
          </div>
        </div>
        <div class="tc-body">
          <div class="tc-r1">
            <div class="tc-name">${esc(t.name)}</div>
            <div class="tc-dist num">${distTxt}</div>
          </div>
          <div class="tc-addr">${esc(t.address)}</div>
          <div class="tc-tags">
            ${t.is24h ? '<span class="pill p24">24시간</span>' : ''}
            ${t.disabled ? '<span class="pill pdis">♿ 장애인</span>' : ''}
            ${t.baby ? '<span class="pill pbaby">🍼 유아</span>' : ''}
            ${t.cctv ? '<span class="pill pccv">📹 CCTV</span>' : ''}
            ${!t.verified ? '<span class="pill pchk">위치 확인중</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ──────────────────────────────────────────────────────
// 패널 토글
// ──────────────────────────────────────────────────────
function togglePanel() {
  const p = document.getElementById('panel');
  if (p.classList.contains('full')) { p.classList.remove('full'); p.classList.add('half'); }
  else if (p.classList.contains('half')) { p.classList.remove('half'); }
  else { p.classList.add('half'); }
}

// ──────────────────────────────────────────────────────
// 상세 패널
// ──────────────────────────────────────────────────────
function openDetail(id, silent) {
  const t = allData.find(x => x.id === id);
  if (!t) return;
  openId = id;
  t.dist = Math.round(haversine(uLat, uLng, t.lat, t.lng));

  document.getElementById('dKind').textContent = t.kind;
  document.getElementById('dName').textContent = t.name;
  document.getElementById('dAddr').textContent = t.address;
  document.getElementById('dTags').innerHTML = `
    ${t.is24h ? '<span class="pill p24">24시간</span>' : ''}
    ${t.disabled ? '<span class="pill pdis">♿ 장애인</span>' : ''}
    ${t.baby ? '<span class="pill pbaby">🍼 유아</span>' : ''}
    ${t.cctv ? '<span class="pill pccv">📹 CCTV</span>' : ''}
    ${t.bell ? '<span class="pill pbell">🔔 비상벨</span>' : ''}
  `;

  document.getElementById('dAccNote').innerHTML = t.verified ? '' : `
    <div class="acc-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D99B22" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
      <span>이 위치는 공공데이터 기준 좌표 정확도가 낮을 수 있어요. 실제 위치와 다를 경우 지도를 참고해 근처를 확인해주세요.</span>
    </div>`;

  const min = walkMinutes(t.dist);
  const { dash, color } = ringSvg(min, 31);
  document.getElementById('dRingFg').setAttribute('stroke', color);
  document.getElementById('dRingFg').setAttribute('stroke-dasharray', dash);
  document.getElementById('dRingMin').textContent = min;
  document.getElementById('dDistV').textContent = t.dist >= 1000 ? (t.dist/1000).toFixed(2) + ' km' : t.dist + ' m';

  if (silent) return;  // 실시간 위치 갱신용 - 거리 숫자만 갱신, 패널 애니메이션/지도 이동 없음

  document.getElementById('iGrid').innerHTML = `
    <div class="ig"><div class="ig-l">운영시간</div><div class="ig-v">${esc(t.hours || '정보없음')}</div></div>
    <div class="ig"><div class="ig-l">구분</div><div class="ig-v">${esc(t.kind)}</div></div>
    <div class="ig"><div class="ig-l">전화</div><div class="ig-v">${t.tel ? `<a href="tel:${t.tel}">${esc(t.tel)}</a>` : '정보없음'}</div></div>
    <div class="ig"><div class="ig-l">위치 확인 상태</div><div class="ig-v">${t.verified ? '✅ 확인됨' : '⚠️ 확인중'}</div></div>
  `;

  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('panel').classList.remove('full');
  map.panTo([t.lat, t.lng]);
  renderList(sortList(dispList, curSort));
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  openId = null;
  renderList(sortList(dispList, curSort));
}
function onSearchInput(v) {
  document.getElementById('sbox').classList.toggle('has', v.trim().length > 0);
  if (!v.trim()) { updateNearby(); return; }
  const q = v.trim();
  let res = allData
    .filter(t => t.name.includes(q) || t.address.includes(q))
    .map(t => ({ ...t, dist: Math.round(haversine(uLat, uLng, t.lat, t.lng)) }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 60);
  res = filterData(res, curFilter);
  dispList = res;
  document.getElementById('panel').classList.add('half');
  renderList(sortList(res, curSort));
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('sbox').classList.remove('has');
  updateNearby();
}

// ──────────────────────────────────────────────────────
// 길찾기
// ──────────────────────────────────────────────────────
function openRoute() {
  const t = allData.find(x => x.id === openId);
  if (!t) return;
  routeTarget = t;
  document.getElementById('routePanel').classList.add('show');
  fetchRoute(t, curMode);
}

function setMode(mode, btn) {
  curMode = mode;
  document.querySelectorAll('.mbt').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  if (routeTarget) fetchRoute(routeTarget, mode);
}

function closeRoute() {
  document.getElementById('routePanel').classList.remove('show');
  clearRouteLines();
  routeTarget = null;
  if (routeController) { routeController.abort(); routeController = null; }
}

function clearRouteLines() {
  routeLines.forEach(l => { try { map.removeLayer(l); } catch(e){} });
  routeLines = [];
}

function fetchRoute(t, mode) {
  if (routeController) routeController.abort();
  routeController = new AbortController();
  clearRouteLines();

  document.getElementById('rtTime').textContent = '-';
  document.getElementById('rtDist').textContent = '-';
  document.getElementById('rtSpeed').textContent = '-';
  document.getElementById('stepsWrap').innerHTML = '<div style="padding:20px;text-align:center;color:var(--t3);font-size:13px">경로 계산 중...</div>';

  const profile = OSRM_PROFILE[mode];
  const url = `https://router.project-osrm.org/route/v1/${profile}/${uLng},${uLat};${t.lng},${t.lat}?steps=true&geometries=geojson&overview=full&annotations=false`;

  fetch(url, { signal: routeController.signal })
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(data => {
      if (!data.routes || !data.routes.length) throw new Error('경로 없음');
      const route = data.routes[0];
      const leg = route.legs[0];
      const distM = Math.round(route.distance);
      let durMin, kmh;
      if (mode === 'car') {
        // 자동차: OSRM이 도로 종류·제한속도 기준으로 계산한 실제 주행시간 그대로 사용
        durMin = Math.max(1, Math.round(route.duration / 60));
        kmh = Math.round((distM / 1000) / (route.duration / 3600));
      } else {
        // 도보/자전거: 실시간 교통정보가 없어 지도 서비스들도 공통으로 쓰는 방식—
        // 실제 경로 거리 ÷ 표준 속도(도보 4km/h, 자전거 15km/h)
        durMin = Math.max(1, Math.round(distM / SPEED_PER_MIN[mode]));
        kmh = SPEED_KMH[mode];
      }

      document.getElementById('rtTime').textContent = durMin;
      document.getElementById('rtTimeU').textContent = '분';
      document.getElementById('rtDist').textContent = distM >= 1000 ? (distM/1000).toFixed(2) : distM;
      document.getElementById('rtDistU').textContent = distM >= 1000 ? 'km' : 'm';
      document.getElementById('rtSpeed').textContent = kmh;
      document.getElementById('rpTitle').textContent = `${MODE_LABEL[mode]} · ${durMin}분 · ${distM >= 1000 ? (distM/1000).toFixed(1)+'km' : distM+'m'}`;

      const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
      const outline = L.polyline(coords, { color: 'white', weight: 9, opacity: .9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      const mainLine = L.polyline(coords, { color: ROUTE_COLOR[mode], weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      routeLines.push(outline, mainLine);

      const startM = L.circleMarker([uLat, uLng], { radius: 9, fillColor: '#2A7FE8', color: 'white', weight: 3, fillOpacity: 1 }).addTo(map);
      const endIcon = L.divIcon({
        className: '',
        html: `<div style="background:${ROUTE_COLOR[mode]};color:white;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;border:2px solid white;">🚻 ${esc(t.name)}</div>`,
        iconAnchor: [0, 36]
      });
      const endM = L.marker([t.lat, t.lng], { icon: endIcon }).addTo(map);
      routeLines.push(startM, endM);

      map.fitBounds(L.polyline(coords).getBounds(), { padding: [65, 90] });
      renderSteps(leg.steps || [], t, mode);    })
    .catch(err => {
      if (err.name === 'AbortError') return;
      const d = Math.round(haversine(uLat, uLng, t.lat, t.lng));
      const tm = Math.max(1, Math.round(d / SPEED_PER_MIN[mode]));

      document.getElementById('rtTime').textContent = tm;
      document.getElementById('rtTimeU').textContent = '분';
      document.getElementById('rtDist').textContent = d >= 1000 ? (d/1000).toFixed(1) : d;
      document.getElementById('rtDistU').textContent = d >= 1000 ? 'km' : 'm';
      document.getElementById('rtSpeed').textContent = SPEED_KMH[mode];
      document.getElementById('rpTitle').textContent = `${MODE_LABEL[mode]} · 약 ${tm}분 (직선거리 추정)`;

      const line = L.polyline([[uLat, uLng], [t.lat, t.lng]], { color: ROUTE_COLOR[mode], weight: 5, opacity: .7, dashArray: '10,8' }).addTo(map);
      routeLines.push(line);
      map.fitBounds([[uLat, uLng], [t.lat, t.lng]], { padding: [65, 90] });

      document.getElementById('stepsWrap').innerHTML = `
        <div class="step">
          <div class="step-ico">📡</div>
          <div>
            <div class="step-txt">경로 서버에 연결하지 못했어요</div>
            <div class="step-sub">
              <span>직선거리 ${d >= 1000 ? (d/1000).toFixed(1)+'km' : d+'m'}</span>
              <span>추정 ${tm}분</span>
            </div>
          </div>
        </div>`;
    });
}

function renderSteps(steps, t, mode) {
  if (!steps.length) {
    document.getElementById('stepsWrap').innerHTML = '<div style="padding:12px;font-size:12px;color:var(--t3)">경로 안내 데이터가 없어요</div>';
    return;
  }
  function getIcon(type, modifier) {
    const m = modifier || '';
    const icons = {
      'depart':'🚩','arrive':'🚻','straight':'⬆️','continue':'⬆️','new name':'⬆️',
      'end of road': m.includes('right') ? '➡️' : '⬅️',
      'turn': m === 'right' ? '➡️' : m === 'left' ? '⬅️' : m === 'slight right' ? '↗️' : m === 'slight left' ? '↖️' : m === 'sharp right' ? '↘️' : m === 'sharp left' ? '↙️' : m === 'uturn' ? '↩️' : '⬆️',
      'fork': m.includes('right') ? '↗️' : '↖️',
      'merge': m.includes('right') ? '↗️' : '↖️',
      'on ramp':'↗️','off ramp':'↘️','roundabout':'🔄','rotary':'🔄','exit roundabout':'↪️','exit rotary':'↪️','notification':'ℹ️',
    };
    return icons[type] || '⬆️';
  }
  let cumDist = 0;
  const html = steps.map((s, i) => {
    const isFirst = i === 0, isLast = i === steps.length - 1;
    const mn = s.maneuver || {}; const type = mn.type || 'straight'; const mod = mn.modifier || '';
    const ico = getIcon(type, mod);
    const stepD = Math.round(s.distance);
    let stepT;
    if (mode === 'car' && typeof s.duration === 'number') {
      stepT = Math.max(1, Math.round(s.duration));  // OSRM이 준 실제 구간 소요시간(초)
    } else {
      const speedSec = SPEED_PER_MIN[mode] / 60;
      stepT = Math.max(1, Math.round(stepD / speedSec));
    }
    cumDist += stepD;
    const dTxt = stepD >= 1000 ? (stepD/1000).toFixed(1)+'km' : stepD+'m';
    const tTxt = stepT >= 60 ? `${Math.floor(stepT/60)}분 ${stepT%60}초` : `${stepT}초`;
    const cumTxt = cumDist >= 1000 ? (cumDist/1000).toFixed(1)+'km' : cumDist+'m';
    const road = s.name || ''; const ref = s.ref || '';
    const isCross = mode === 'walk' && !road && stepD < 30 && !isFirst && !isLast;
    let stepTitle = '';
    if (isFirst) stepTitle = '출발';
    else if (isLast) stepTitle = `<b>🚻 ${esc(t.name)}</b> 도착`;
    else if (isCross) stepTitle = '횡단보도 건너기';
    else if (road) { stepTitle = `<b>${esc(road)}</b>`; if (ref) stepTitle += ` <span class="badge-road">${esc(ref)}</span>`; }
    else {
      const turnMap = { 'turn right':'우회전','turn left':'좌회전','slight right':'우측으로','slight left':'좌측으로','sharp right':'급우회전','sharp left':'급좌회전','uturn':'유턴','straight':'직진','continue':'계속 직진' };
      const key = mod ? `${type === 'turn' ? '' : type+' '}${mod}`.trim() : type;
      stepTitle = turnMap[key] || turnMap[mod] || '계속 진행';
    }
    return `
      <div class="step">
        <div class="step-ico">${ico}</div>
        <div style="flex:1">
          <div class="step-txt">${stepTitle}</div>
          <div class="step-sub">
            <span>${dTxt}</span><span>${tTxt}</span>
            ${!isFirst ? `<span>누적 ${cumTxt}</span>` : ''}
            ${isCross ? '<span class="badge-cross">🚦 횡단보도</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join('');
  document.getElementById('stepsWrap').innerHTML = html;
}

// ──────────────────────────────────────────────────────
// 긴급 모드
// ──────────────────────────────────────────────────────
function showUrg() {
  const verifiedNear = nearList.find(t => t.verified);
  const c = verifiedNear || nearList[0];
  if (!c) { showToast('❌ 주변 화장실 정보가 없어요'); return; }
  document.getElementById('urgName').textContent = c.name;
  const d = c.dist >= 1000 ? (c.dist/1000).toFixed(1)+'km' : c.dist+'m';
  document.getElementById('urgDist').textContent = `${d} · 도보 약 ${walkMinutes(c.dist)}분`;
  document.getElementById('urgPanel').classList.add('show');
  window._urgId = c.id;
}
function hideUrg() { document.getElementById('urgPanel').classList.remove('show'); }
function urgGo() {
  hideUrg();
  const t = allData.find(x => x.id === window._urgId);
  if (!t) return;
  map.setView([t.lat, t.lng], 17);
  openDetail(t.id);
  setTimeout(openRoute, 250);
}
function haversine(la1, ln1, la2, ln2) {
  const R = 6371000;
  const dLa = (la2 - la1) * Math.PI / 180;
  const dLn = (ln2 - ln1) * Math.PI / 180;
  const a = Math.sin(dLa/2)**2 + Math.cos(la1*Math.PI/180) * Math.cos(la2*Math.PI/180) * Math.sin(dLn/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

window.onload = initMap;
</script>
